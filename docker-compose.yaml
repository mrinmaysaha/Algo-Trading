services:
  # ============================================================================
  # INSTANCE 1: ANGEL ONE (NSE / NFO / MCX) - DOMESTIC SESSIONS
  # ============================================================================
  openalgo-angel:
    image: openalgo:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: openalgo-angel
    ports:
      - "${FLASK_PORT:-5000}:5000"
      - "${WEBSOCKET_PORT:-8765}:8765"

    # persistent DB, strategies, logs + mount the host .env
    volumes:
      - openalgo_db:/app/db
      - openalgo_log:/app/log            # Application logs (named volume)
      - ./strategies:/app/strategies     # Python strategies (host bind mount)
      - ./backtesting:/app/backtesting   # Backtesting engine (host bind mount)
      - openalgo_keys:/app/keys          # API keys/certificates (named volume)
      - openalgo_tmp:/app/tmp            # Temporary directory for numba/scipy (named volume)
      - ./.env:/app/.env

    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TZ=Asia/Kolkata
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-2}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-2}
      - NUMBA_NUM_THREADS=${NUMBA_NUM_THREADS:-2}
      - STRATEGY_MEMORY_LIMIT_MB=${STRATEGY_MEMORY_LIMIT_MB:-1024}

    shm_size: ${SHM_SIZE:-512m}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/auth/check-setup"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s

    restart: unless-stopped

  # ============================================================================
  # INSTANCE 2: GLOBAL 24/7 (CRYPTO & GOLD USD) - CONTINUOUS EXECUTION
  # ============================================================================
  openalgo-global:
    image: openalgo:latest
    container_name: openalgo-global
    ports:
      - "5001:5000"                      # Host Port 5001 -> Container Port 5000
      - "8766:8765"                      # Host Port 8766 -> Container Port 8765

    # Isolated persistent DB, logs, and 24/7 global strategies
    volumes:
      - openalgo_global_db:/app/db
      - openalgo_global_log:/app/log
      - ./strategies_global:/app/strategies
      - ./backtesting:/app/backtesting
      - openalgo_global_keys:/app/keys
      - openalgo_global_tmp:/app/tmp
      - ./.env.global:/app/.env

    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TZ=Asia/Kolkata
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-2}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-2}
      - NUMBA_NUM_THREADS=${NUMBA_NUM_THREADS:-2}
      - STRATEGY_MEMORY_LIMIT_MB=${STRATEGY_MEMORY_LIMIT_MB:-1024}

    shm_size: ${SHM_SIZE:-512m}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/auth/check-setup"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s

    restart: unless-stopped

# Define named volumes for persistence (Angel One & Global isolated)
volumes:
  openalgo_db:
    driver: local
  openalgo_log:
    driver: local
  openalgo_strategies:
    driver: local
  openalgo_keys:
    driver: local
  openalgo_tmp:
    driver: local
  openalgo_global_db:
    driver: local
  openalgo_global_log:
    driver: local
  openalgo_global_keys:
    driver: local
  openalgo_global_tmp:
    driver: local
